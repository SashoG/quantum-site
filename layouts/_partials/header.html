<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="{{ site.Home.RelPermalink }}">
      <span class="brand-title">{{ site.Title }}</span>
      <span class="brand-sub">{{ site.Params.university }}</span>
    </a>
    <button class="nav-toggle" type="button" aria-controls="site-nav" aria-expanded="false" hidden>
      {{ i18n "menu" }}
    </button>
    <nav id="site-nav" class="site-nav" aria-label="{{ i18n "main_navigation" }}">
      <ul>
        {{- $current := . }}
        {{- range site.Menus.main }}
        <li><a href="{{ .URL }}"{{ if or ($current.IsMenuCurrent "main" .) ($current.HasMenuCurrent "main" .) }} aria-current="page"{{ end }}>{{ .Name }}</a></li>
        {{- end }}
      </ul>
      {{- with .Translations }}
      <ul class="lang-switch">
        {{- range . }}
        <li><a href="{{ .RelPermalink }}" hreflang="{{ .Language.Lang }}" lang="{{ .Language.Lang }}">{{ .Language.Label }}</a></li>
        {{- end }}
      </ul>
      {{- end }}
    </nav>
  </div>
</header>
